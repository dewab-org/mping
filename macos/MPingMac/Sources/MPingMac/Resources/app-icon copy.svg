<?xml version="1.0" encoding="UTF-8"?>
<svg
    width="1024"
    height="1024"
    viewBox="0 0 1024 1024"
    xmlns="http://www.w3.org/2000/svg"
    version="1.1">

  <!-- ====== DEFINITIONS (GRADIENTS, SHADOWS) ====== -->
  <defs>
    <!-- Background gradient: dark charcoal to slightly lighter -->
    <linearGradient id="backgroundGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#22252B"/>
      <stop offset="100%" stop-color="#15181D"/>
    </linearGradient>

    <!-- Radar rings and grid lines color -->
    <linearGradient id="radarLineGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7F8A96" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#5E6873" stop-opacity="0.9"/>
    </linearGradient>

    <!-- Radar sweep: transparent to bright green -->
    <linearGradient id="radarSweepGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00FF7B" stop-opacity="0.0"/>
      <stop offset="35%" stop-color="#6DFF9F" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#A5FFBF" stop-opacity="0.9"/>
    </linearGradient>

    <!-- Node fill (white with subtle inner shadow hint) -->
    <radialGradient id="nodeFillGradient" cx="30%" cy="25%" r="75%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#E4E7EA"/>
    </radialGradient>

    <!-- Soft outer glow where the sweep hits the edge -->
    <radialGradient id="sweepGlowGradient" cx="80%" cy="25%" r="40%">
      <stop offset="0%" stop-color="#8CFFB2" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#8CFFB2" stop-opacity="0"/>
    </radialGradient>

    <!-- Drop shadow for the foreground network lines & nodes -->
    <filter id="networkDropShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- ====== BACKGROUND ROUNDED SQUARE ====== -->
  <rect
      id="backgroundRoundedSquare"
      x="48"
      y="48"
      width="928"
      height="928"
      rx="220"
      ry="220"
      fill="url(#backgroundGradient)"/>

  <!-- Optional subtle vignette -->
  <rect
      x="48"
      y="48"
      width="928"
      height="928"
      rx="220"
      ry="220"
      fill="black"
      opacity="0.15"/>

  <!-- ====== RADAR CIRCLE OUTLINE & GRID ====== -->
  <!-- Main outer radar circle -->
  <circle
      id="radarOuterCircle"
      cx="512"
      cy="512"
      r="360"
      fill="none"
      stroke="url(#radarLineGradient)"
      stroke-width="6"/>

  <!-- Concentric rings -->
  <circle
      id="radarRingLarge"
      cx="512"
      cy="512"
      r="280"
      fill="none"
      stroke="url(#radarLineGradient)"
      stroke-width="4"/>
  <circle
      id="radarRingMedium"
      cx="512"
      cy="512"
      r="200"
      fill="none"
      stroke="url(#radarLineGradient)"
      stroke-width="3"/>
  <circle
      id="radarRingSmall"
      cx="512"
      cy="512"
      r="120"
      fill="none"
      stroke="url(#radarLineGradient)"
      stroke-width="2.5"/>

  <!-- Vertical and horizontal grid lines -->
  <line
      id="radarVerticalLine"
      x1="512"
      y1="152"
      x2="512"
      y2="872"
      stroke="url(#radarLineGradient)"
      stroke-width="3"/>
  <line
      id="radarHorizontalLine"
      x1="152"
      y1="512"
      x2="872"
      y2="512"
      stroke="url(#radarLineGradient)"
      stroke-width="3"/>

  <!-- ====== RADAR SWEEP (SECTOR) ====== -->
  <!-- Sweeping wedge from center toward top-right -->
  <path
      id="radarSweep"
      d="
        M 512 512
        L 512 152
        A 360 360 0 0 1 848 280
        Z"
      fill="url(#radarSweepGradient)"/>

  <!-- Glow at the end of the sweep touching the outer circle -->
  <circle
      id="radarSweepGlow"
      cx="848"
      cy="280"
      r="120"
      fill="url(#sweepGlowGradient)"/>

  <!-- ====== NETWORK NODES & CONNECTION LINES ====== -->
  <!-- Group with shared drop shadow -->
  <g id="networkGraph" filter="url(#networkDropShadow)">
    <!-- Connection lines (ping paths) -->
    <!-- Center node to top-right node -->
    <line
        id="connectionCenterToTopRight"
        x1="512"
        y1="512"
        x2="780"
        y2="260"
        stroke="#FFFFFF"
        stroke-width="18"
        stroke-linecap="round"/>

    <!-- Center node to left node -->
    <line
        id="connectionCenterToLeft"
        x1="512"
        y1="512"
        x2="270"
        y2="360"
        stroke="#FFFFFF"
        stroke-width="18"
        stroke-linecap="round"/>

    <!-- Center node to bottom-left node -->
    <line
        id="connectionCenterToBottomLeft"
        x1="512"
        y1="512"
        x2="320"
        y2="740"
        stroke="#FFFFFF"
        stroke-width="18"
        stroke-linecap="round"/>

    <!-- Optional: link between left and bottom-left to imply mesh -->
    <line
        id="connectionLeftToBottomLeft"
        x1="270"
        y1="360"
        x2="320"
        y2="740"
        stroke="#FFFFFF"
        stroke-width="14"
        stroke-linecap="round"
        opacity="0.85"/>

    <!-- Nodes (hosts) -->
    <circle
        id="nodeCenterHost"
        cx="512"
        cy="512"
        r="44"
        fill="url(#nodeFillGradient)"/>

    <circle
        id="nodeTopRightHost"
        cx="780"
        cy="260"
        r="44"
        fill="url(#nodeFillGradient)"/>

    <circle
        id="nodeLeftHost"
        cx="270"
        cy="360"
        r="44"
        fill="url(#nodeFillGradient)"/>

    <circle
        id="nodeBottomLeftHost"
        cx="320"
        cy="740"
        r="44"
        fill="url(#nodeFillGradient)"/>
  </g>

  <!-- Optional center highlight to emphasize origin of pings -->
  <circle
      id="centerHighlight"
      cx="512"
      cy="512"
      r="120"
      fill="#00FF7B"
      opacity="0.05"/>

</svg>