<?xml version="1.0" encoding="UTF-8"?>
<svg
    width="1024"
    height="1024"
    viewBox="0 0 1024 1024"
    xmlns="http://www.w3.org/2000/svg"
    version="1.1">

  <!-- ========= DEFINITIONS ========= -->
  <defs>
    <!-- Background gradient -->
    <linearGradient id="backgroundGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#22252B"/>
      <stop offset="100%" stop-color="#15181D"/>
    </linearGradient>

    <!-- Radar line gradient -->
    <linearGradient id="radarLineGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7F8A96" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#5E6873" stop-opacity="0.9"/>
    </linearGradient>

    <!-- Radar sweep -->
    <linearGradient id="radarSweepGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00FF7B" stop-opacity="0.0"/>
      <stop offset="35%" stop-color="#6DFF9F" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#A5FFBF" stop-opacity="0.9"/>
    </linearGradient>

    <!-- Node fill -->
    <radialGradient id="nodeFillGradient" cx="30%" cy="25%" r="75%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#E4E7EA"/>
    </radialGradient>

    <!-- Sweep glow -->
    <radialGradient id="sweepGlowGradient" cx="80%" cy="25%" r="40%">
      <stop offset="0%" stop-color="#8CFFB2" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#8CFFB2" stop-opacity="0"/>
    </radialGradient>

    <!-- Drop shadow for MP strokes and nodes -->
    <filter id="networkDropShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- ========= BACKGROUND ========= -->
  <rect
      x="48"
      y="48"
      width="928"
      height="928"
      rx="220"
      ry="220"
      fill="url(#backgroundGradient)"/>
  <rect
      x="48"
      y="48"
      width="928"
      height="928"
      rx="220"
      ry="220"
      fill="black"
      opacity="0.15"/>

  <!-- ========= RADAR GRID ========= -->
  <circle
      cx="512"
      cy="512"
      r="360"
      fill="none"
      stroke="url(#radarLineGradient)"
      stroke-width="6"/>

  <circle cx="512" cy="512" r="280" fill="none"
          stroke="url(#radarLineGradient)" stroke-width="4"/>
  <circle cx="512" cy="512" r="200" fill="none"
          stroke="url(#radarLineGradient)" stroke-width="3"/>
  <circle cx="512" cy="512" r="120" fill="none"
          stroke="url(#radarLineGradient)" stroke-width="2.5"/>

  <line x1="512" y1="152" x2="512" y2="872"
        stroke="url(#radarLineGradient)" stroke-width="3"/>
  <line x1="152" y1="512" x2="872" y2="512"
        stroke="url(#radarLineGradient)" stroke-width="3"/>

  <!-- ========= RADAR SWEEP ========= -->
  <path
      d="M 512 512
         L 512 152
         A 360 360 0 0 1 848 280
         Z"
      fill="url(#radarSweepGradient)"/>

  <circle
      cx="848"
      cy="280"
      r="120"
      fill="url(#sweepGlowGradient)"/>

  <!-- ========= MP FOREGROUND MARK ========= -->
  <g id="mpMark" filter="url(#networkDropShadow)">
    <!-- Stylized M -->
    <path
        id="letterM"
        d="M 280 740
           L 280 320
           L 420 580
           L 560 320
           L 560 740"
        fill="none"
        stroke="#FFFFFF"
        stroke-width="40"
        stroke-linecap="round"
        stroke-linejoin="round"/>

    <!-- Stylized P -->
    <path
        id="letterP"
        d="M 690 740
           L 690 320
           Q 840 320 840 430
           Q 840 540 690 540"
        fill="none"
        stroke="#FFFFFF"
        stroke-width="40"
        stroke-linecap="round"
        stroke-linejoin="round"/>

    <!-- Node circles at key joints (hosts / ping targets) -->
    <!-- M nodes -->
    <circle cx="280" cy="740" r="32" fill="url(#nodeFillGradient)"/>
    <circle cx="280" cy="320" r="32" fill="url(#nodeFillGradient)"/>
    <circle cx="420" cy="580" r="32" fill="url(#nodeFillGradient)"/>
    <circle cx="560" cy="320" r="32" fill="url(#nodeFillGradient)"/>
    <circle cx="560" cy="740" r="32" fill="url(#nodeFillGradient)"/>

    <!-- P nodes -->
    <circle cx="690" cy="740" r="32" fill="url(#nodeFillGradient)"/>
    <circle cx="690" cy="320" r="32" fill="url(#nodeFillGradient)"/>
    <circle cx="840" cy="430" r="32" fill="url(#nodeFillGradient)"/>
    <circle cx="690" cy="540" r="32" fill="url(#nodeFillGradient)"/>
  </g>

  <!-- Subtle center glow to keep radar feel -->
  <circle
      cx="512"
      cy="512"
      r="140"
      fill="#00FF7B"
      opacity="0.04"/>

</svg>
